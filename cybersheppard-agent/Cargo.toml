[package]
name = "cybersheppard-agent"
version = "1.0.0"
edition = "2021"
authors = ["Dognet Technologies"]
description = "CyberSheppard monitoring agent for target systems"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Compression
zstd = "0.13"

# HTTP client
reqwest = { version = "0.11", features = ["json", "native-tls"] }

# Configuration
config = "0.14"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# System info
sysinfo = "0.30"
procfs = "0.16"

# Hashing for file integrity
sha2 = "0.10"
walkdir = "2.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Hostname
hostname = "0.3"

# Cross-platform paths
dirs = "5.0"

# Unix system calls
nix = { version = "0.27", features = ["fs"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
