# ============================================================================
# CyberSheppard — Configurazione Laurel (0.8.x)
# ============================================================================
# Laurel gira come plugin di auditd sul TARGET: legge lo stream audit da stdin,
# arricchisce (process ancestry, argv, uid→nome) e scrive JSON (una riga = un
# evento) in {directory}/{auditlog.file}. Il dog_agent legge quel file
# (laurel_log_path) e lo inoltra → security_events → correlazione MITRE.
#
# Output atteso dall'agent: /var/log/laurel/audit.log
# Formato allineato alla release 0.8.2 (github.com/threathunters-io/laurel).

directory = "/var/log/laurel"
# Utente non privilegiato a cui Laurel fa drop dei privilegi (creato in install).
user = "_laurel"
statusreport-period = 0
input = "stdin"

[auditlog]
file = "audit.log"
size = 10000000        # ~10 MB per generazione
generations = 10
# root (che esegue il dog_agent) può leggere il log.
read-users = ["root"]

[state]
file = "state"
generations = 0
max-age = 60

[transform]
# argv di execve come array JSON → process_cmdline ricco e parsabile.
execve-argv = [ "array" ]

[translate]
# Traduce uid/gid → nomi e costanti syscall → mnemonici (utile ai detector).
universal = true
user-db = true
drop-raw = false

[enrich]
pid = true             # ppid / catena antenati (R6, R7)
spawned-by = true
container = true
systemd = true         # unit systemd del processo
script = true
user-groups = true
# Variabili d'ambiente sospette da preservare (es. LD_PRELOAD → evasion).
execve-env = ["LD_PRELOAD", "LD_LIBRARY_PATH"]

[filter]
# Non filtrare eventi senza key: li vogliamo tutti per la correlazione.
filter-null-keys = false
filter-action = "drop"
