# CyberSheppard — Registrazione di Laurel come plugin di auditd.
# Installare come /etc/audit/plugins.d/laurel.conf (o /etc/audisp/plugins.d/ su
# distro più vecchie). Dopo l'installazione: `systemctl restart auditd`.
active = yes
direction = out
type = always
format = string
path = /usr/local/sbin/laurel
args = --config /etc/laurel/config.toml
