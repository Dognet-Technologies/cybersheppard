version: '3.8'

# ============================================================================
# CYBERSHEPPARD (MicroSIEM) - Docker Compose Configuration
# ============================================================================

services:
  # ==========================================================================
  # POSTGRESQL - Metadata Database
  # ==========================================================================
  postgresql:
    image: postgres:16-alpine
    container_name: cybersheppard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybersheppard}
      POSTGRES_USER: ${POSTGRES_USER:-cybersheppard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybersheppard_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/postgresql/migrations:/docker-entrypoint-initdb.d
    networks:
      - cybersheppard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybersheppard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # INFLUXDB - Time-Series Database
  # ==========================================================================
  influxdb:
    image: influxdb:2.7-alpine
    container_name: cybersheppard-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-cybersheppard_influx}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-cybersheppard}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET_METRICS:-metrics}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-cybersheppard_token}
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - cybersheppard-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # RUST BACKEND (Axum) - Main API Server
  # ==========================================================================
  rust-backend:
    build:
      context: ./backend-rust
      dockerfile: ../docker/rust-backend/Dockerfile
    container_name: cybersheppard-rust
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cybersheppard}
      POSTGRES_USER: ${POSTGRES_USER:-cybersheppard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybersheppard_password}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-cybersheppard_token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-cybersheppard}
      JWT_SECRET: ${JWT_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    volumes:
      - ./logs/rust-backend:/app/logs
    networks:
      - cybersheppard-network

  # ==========================================================================
  # DJANGO BACKEND - Hardening Engine
  # ==========================================================================
  django-backend:
    build:
      context: ./backend-django
      dockerfile: ../docker/django-backend/Dockerfile
    container_name: cybersheppard-django
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cybersheppard}
      POSTGRES_USER: ${POSTGRES_USER:-cybersheppard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybersheppard_password}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    ports:
      - "8001:8001"
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ./hardening-models:/app/hardening-models:ro
      - ./tmp/backups:/app/tmp/backups
      - ./logs/django-backend:/app/logs
      - ssh-keys:/app/ssh-keys
    networks:
      - cybersheppard-network

  # ==========================================================================
  # FRONTEND (React + Vite) - Development Server
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: cybersheppard-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "5173:5173"
    depends_on:
      - rust-backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - cybersheppard-network
    stdin_open: true
    tty: true

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  cybersheppard-network:
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres-data:
    driver: local
  influxdb-data:
    driver: local
  influxdb-config:
    driver: local
  ssh-keys:
    driver: local
