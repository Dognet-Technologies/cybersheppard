# ============================================================================
# CyberSheppard Hardening Model - Sysctl (Base)
# ============================================================================
# Basic kernel parameter hardening
# Compliance: NIS2, ISO27001

name: "sysctl_base"
description: "Basic kernel parameter security hardening"
compliance_standards:
  - "NIS2"
  - "ISO27001"

# ============================================================================
# File Operations
# ============================================================================
file_operations:
  # Sysctl configuration
  - path: "/etc/sysctl.d/99-cybersheppard.conf"
    action: "create"
    mode: "0644"
    owner: "root"
    group: "root"
    backup: true
    content: |
      # CyberSheppard Kernel Security Parameters - Base
      # Generated by CyberSheppard MicroSIEM

      # ============================================================================
      # Network Security
      # ============================================================================

      # IP Forwarding (disable if not a router)
      net.ipv4.ip_forward = 0
      net.ipv6.conf.all.forwarding = 0

      # Reverse Path Filtering
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1

      # Do not accept source routing
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.conf.default.accept_source_route = 0
      net.ipv6.conf.all.accept_source_route = 0
      net.ipv6.conf.default.accept_source_route = 0

      # ICMP Redirect acceptance
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv6.conf.default.accept_redirects = 0

      # Secure ICMP redirects
      net.ipv4.conf.all.secure_redirects = 0
      net.ipv4.conf.default.secure_redirects = 0

      # Do not send ICMP redirects
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0

      # Log Martian packets
      net.ipv4.conf.all.log_martians = 1
      net.ipv4.conf.default.log_martians = 1

      # Ignore ICMP ping requests
      net.ipv4.icmp_echo_ignore_all = 0

      # Ignore broadcast pings
      net.ipv4.icmp_echo_ignore_broadcasts = 1

      # Ignore bogus ICMP error responses
      net.ipv4.icmp_ignore_bogus_error_responses = 1

      # TCP SYN cookies for DDoS protection
      net.ipv4.tcp_syncookies = 1

      # TCP timestamps
      net.ipv4.tcp_timestamps = 1

      # ============================================================================
      # IPv6 Hardening
      # ============================================================================

      # Disable IPv6 Router Advertisements
      net.ipv6.conf.all.accept_ra = 0
      net.ipv6.conf.default.accept_ra = 0

      # ============================================================================
      # Kernel Security
      # ============================================================================

      # Restrict kernel pointer exposure
      kernel.kptr_restrict = 1

      # Restrict dmesg access
      kernel.dmesg_restrict = 1

      # Restrict access to kernel logs
      kernel.printk = 3 3 3 3

      # Enable ASLR
      kernel.randomize_va_space = 2

      # Restrict core dumps
      kernel.core_uses_pid = 1
      fs.suid_dumpable = 0

      # ============================================================================
      # System Security
      # ============================================================================

      # Increase inotify watches (for monitoring)
      fs.inotify.max_user_watches = 524288

      # Restrict ptrace
      kernel.yama.ptrace_scope = 1

# ============================================================================
# Sysctl Parameters (applied immediately)
# ============================================================================
sysctl_parameters:
  # Network Security
  - name: "net.ipv4.ip_forward"
    value: "0"
    description: "Disable IP forwarding"

  - name: "net.ipv4.conf.all.rp_filter"
    value: "1"
    description: "Enable reverse path filtering"

  - name: "net.ipv4.conf.all.accept_source_route"
    value: "0"
    description: "Disable source routing"

  - name: "net.ipv4.conf.all.accept_redirects"
    value: "0"
    description: "Disable ICMP redirects"

  - name: "net.ipv4.conf.all.send_redirects"
    value: "0"
    description: "Disable sending ICMP redirects"

  - name: "net.ipv4.conf.all.log_martians"
    value: "1"
    description: "Log martian packets"

  - name: "net.ipv4.icmp_echo_ignore_broadcasts"
    value: "1"
    description: "Ignore broadcast pings"

  - name: "net.ipv4.tcp_syncookies"
    value: "1"
    description: "Enable TCP SYN cookies"

  # Kernel Security
  - name: "kernel.kptr_restrict"
    value: "1"
    description: "Restrict kernel pointer exposure"

  - name: "kernel.dmesg_restrict"
    value: "1"
    description: "Restrict dmesg access"

  - name: "kernel.randomize_va_space"
    value: "2"
    description: "Enable full ASLR"

  - name: "kernel.yama.ptrace_scope"
    value: "1"
    description: "Restrict ptrace to parent processes only"

  - name: "fs.suid_dumpable"
    value: "0"
    description: "Disable core dumps for setuid programs"

# ============================================================================
# Custom Commands
# ============================================================================
custom_commands:
  # Apply sysctl settings
  - "sysctl -p /etc/sysctl.d/99-cybersheppard.conf"

  # Reload all sysctl configs
  - "sysctl --system"

# ============================================================================
# Validation Commands
# ============================================================================
validation_commands:
  - "test -f /etc/sysctl.d/99-cybersheppard.conf"
  - "sysctl net.ipv4.tcp_syncookies | grep -q '= 1'"
  - "sysctl kernel.randomize_va_space | grep -q '= 2'"
  - "sysctl net.ipv4.ip_forward | grep -q '= 0'"
