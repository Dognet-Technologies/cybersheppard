# ============================================================================
# CyberSheppard Hardening Model - Auditd (Base)
# ============================================================================
# Basic auditd configuration for syscall monitoring
# Compliance: NIS2, ISO27001

name: "auditd_base"
description: "Basic audit daemon configuration and rules"
compliance_standards:
  - "NIS2"
  - "ISO27001"

# ============================================================================
# Package Operations
# ============================================================================
package_operations:
  - name: "auditd"
    action: "install"

  - name: "audispd-plugins"
    action: "install"

# ============================================================================
# File Operations
# ============================================================================
file_operations:
  # Main auditd configuration
  - path: "/etc/audit/auditd.conf"
    action: "modify"
    mode: "0640"
    owner: "root"
    group: "root"
    backup: true
    content: |
      # CyberSheppard Auditd Configuration - Base

      # Log file settings
      log_file = /var/log/audit/audit.log
      log_format = ENRICHED
      log_group = adm
      priority_boost = 4
      flush = INCREMENTAL_ASYNC
      freq = 50

      # Disk space settings
      max_log_file = 100
      num_logs = 10
      max_log_file_action = ROTATE
      space_left = 500
      space_left_action = SYSLOG
      admin_space_left = 100
      admin_space_left_action = SUSPEND
      disk_full_action = SUSPEND
      disk_error_action = SUSPEND

      # Network settings (disabled by default)
      tcp_listen_port =
      tcp_listen_queue = 5
      tcp_max_per_addr = 1

  # Audit rules - Base monitoring
  - path: "/etc/audit/rules.d/cybersheppard.rules"
    action: "create"
    mode: "0640"
    owner: "root"
    group: "root"
    backup: true
    content: |
      # CyberSheppard Audit Rules - Base Level
      # Generated by CyberSheppard MicroSIEM

      # Remove any existing rules
      -D

      # Buffer size
      -b 8192

      # Failure mode (0=silent, 1=printk, 2=panic)
      -f 1

      # ============================================================================
      # Identity and Authentication
      # ============================================================================
      -w /etc/passwd -p wa -k identity
      -w /etc/group -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/gshadow -p wa -k identity
      -w /etc/security/opasswd -p wa -k identity

      # ============================================================================
      # Sudo and Privilege Escalation
      # ============================================================================
      -w /etc/sudoers -p wa -k sudoers
      -w /etc/sudoers.d/ -p wa -k sudoers
      -w /var/log/sudo.log -p wa -k sudolog

      # ============================================================================
      # SSH Configuration
      # ============================================================================
      -w /etc/ssh/sshd_config -p wa -k sshd_config
      -w /etc/ssh/ssh_config -p wa -k ssh_config

      # ============================================================================
      # System Startup and Configuration
      # ============================================================================
      -w /etc/init.d/ -p wa -k init
      -w /etc/systemd/ -p wa -k systemd
      -w /etc/cron.allow -p wa -k cron
      -w /etc/cron.deny -p wa -k cron
      -w /etc/cron.d/ -p wa -k cron
      -w /etc/cron.daily/ -p wa -k cron
      -w /etc/cron.hourly/ -p wa -k cron
      -w /etc/cron.monthly/ -p wa -k cron
      -w /etc/cron.weekly/ -p wa -k cron
      -w /etc/crontab -p wa -k cron

      # ============================================================================
      # Network Configuration
      # ============================================================================
      -w /etc/hosts -p wa -k network_config
      -w /etc/network/ -p wa -k network_config
      -w /etc/sysconfig/network-scripts/ -p wa -k network_config

      # ============================================================================
      # System Calls - Network
      # ============================================================================
      -a always,exit -F arch=b64 -S socket -S connect -S bind -k network
      -a always,exit -F arch=b32 -S socket -S connect -S bind -k network

      # ============================================================================
      # System Calls - Process Execution
      # ============================================================================
      -a always,exit -F arch=b64 -S execve -k exec
      -a always,exit -F arch=b32 -S execve -k exec

      # ============================================================================
      # File Deletion
      # ============================================================================
      -a always,exit -F arch=b64 -S unlink -S unlinkat -S rename -S renameat -k delete
      -a always,exit -F arch=b32 -S unlink -S unlinkat -S rename -S renameat -k delete

      # Make configuration immutable
      -e 2

# ============================================================================
# Service Operations
# ============================================================================
service_operations:
  - name: "auditd"
    action: "enable"
    enabled: true

  - name: "auditd"
    action: "restart"

# ============================================================================
# Custom Commands
# ============================================================================
custom_commands:
  # Load audit rules
  - "augenrules --load"

  # Verify rules are loaded
  - "auditctl -l | grep -q cybersheppard || auditctl -R /etc/audit/rules.d/cybersheppard.rules"

  # Create audit log directory if missing
  - "mkdir -p /var/log/audit"
  - "chmod 750 /var/log/audit"

# ============================================================================
# Validation Commands
# ============================================================================
validation_commands:
  - "systemctl is-active auditd"
  - "auditctl -l | grep -q identity"
  - "auditctl -l | grep -q sudoers"
  - "test -f /var/log/audit/audit.log"
