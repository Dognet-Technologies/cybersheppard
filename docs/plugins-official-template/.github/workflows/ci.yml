name: Plugin CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  lint-python:
    name: Lint Python Plugins
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black pylint flake8

    - name: Find Python plugins
      id: find-plugins
      run: |
        echo "Found Python plugins:"
        find . -name "plugin.py" -type f

    - name: Run black (formatting check)
      run: |
        for plugin in $(find . -name "plugin.py" -type f); do
          echo "Checking $plugin"
          black --check --line-length 100 "$plugin" || exit 1
        done

    - name: Run pylint
      run: |
        for plugin in $(find . -name "plugin.py" -type f); do
          echo "Linting $plugin"
          pylint "$plugin" --fail-under=8.0 || exit 1
        done

    - name: Run flake8
      run: |
        for plugin in $(find . -name "plugin.py" -type f); do
          echo "Checking $plugin with flake8"
          flake8 "$plugin" --max-line-length=100 --ignore=E203,W503 || exit 1
        done

  lint-rust:
    name: Lint Rust Plugins
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy
        override: true

    - name: Find Rust plugins
      run: |
        echo "Found Rust plugins:"
        find . -name "Cargo.toml" -type f

    - name: Run rustfmt
      run: |
        for cargo in $(find . -name "Cargo.toml" -type f); do
          dir=$(dirname "$cargo")
          echo "Checking $dir"
          cd "$dir" && cargo fmt -- --check || exit 1
          cd - > /dev/null
        done

    - name: Run clippy
      run: |
        for cargo in $(find . -name "Cargo.toml" -type f); do
          dir=$(dirname "$cargo")
          echo "Linting $dir"
          cd "$dir" && cargo clippy -- -D warnings || exit 1
          cd - > /dev/null
        done

  test-python:
    name: Test Python Plugins
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio

    - name: Find and test plugins
      run: |
        for plugin_dir in $(find . -name "tests" -type d); do
          parent_dir=$(dirname "$plugin_dir")
          echo "Testing plugin in $parent_dir"

          # Install requirements if exists
          if [ -f "$parent_dir/requirements.txt" ]; then
            pip install -r "$parent_dir/requirements.txt"
          fi

          # Run tests with coverage
          cd "$parent_dir"
          pytest tests/ --cov=. --cov-report=xml --cov-report=term --cov-fail-under=70 || exit 1
          cd - > /dev/null
        done

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: plugins
        name: plugin-coverage

  test-rust:
    name: Test Rust Plugins
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Find and test Rust plugins
      run: |
        for cargo in $(find . -name "Cargo.toml" -type f); do
          dir=$(dirname "$cargo")
          echo "Testing $dir"
          cd "$dir" && cargo test || exit 1
          cd - > /dev/null
        done

  validate-manifests:
    name: Validate Plugin Manifests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install jsonschema
      run: pip install jsonschema

    - name: Validate all manifest.json files
      run: |
        python3 << 'EOF'
        import json
        import sys
        from pathlib import Path

        def validate_manifest(manifest_path):
            with open(manifest_path, 'r') as f:
                data = json.load(f)

            required_fields = [
                'name', 'version', 'product', 'stato', 'stability_level',
                'description', 'author', 'entry_point'
            ]

            missing = [f for f in required_fields if f not in data]
            if missing:
                print(f"❌ {manifest_path}: Missing fields: {missing}")
                return False

            # Validate product
            if data['product'] not in ['cybersheppard', 'sentinelcore']:
                print(f"❌ {manifest_path}: Invalid product: {data['product']}")
                return False

            # Validate stato
            if data['stato'] not in ['stable', 'unstable']:
                print(f"❌ {manifest_path}: Invalid stato: {data['stato']}")
                return False

            # Validate stability_level
            if data['stability_level'] not in ['alpha', 'beta', 'complete']:
                print(f"❌ {manifest_path}: Invalid stability_level: {data['stability_level']}")
                return False

            print(f"✅ {manifest_path}: Valid")
            return True

        manifests = list(Path('.').rglob('manifest.json'))
        print(f"Found {len(manifests)} manifest files")

        all_valid = all(validate_manifest(m) for m in manifests)
        sys.exit(0 if all_valid else 1)
        EOF

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  generate-checksums:
    name: Generate SHA256 Checksums
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [lint-python, lint-rust, test-python, test-rust, validate-manifests, security-scan]

    steps:
    - uses: actions/checkout@v4

    - name: Generate checksums for all plugins
      run: |
        python3 << 'EOF'
        import json
        import hashlib
        from pathlib import Path

        def calculate_checksum(plugin_dir):
            """Calculate SHA256 checksum for plugin files"""
            hasher = hashlib.sha256()

            # Sort files for consistent hashing
            files = sorted([
                f for f in plugin_dir.rglob('*')
                if f.is_file() and f.name != 'manifest.json'
            ])

            for file_path in files:
                with open(file_path, 'rb') as f:
                    hasher.update(f.read())

            return hasher.hexdigest()

        # Find all plugin directories (containing manifest.json)
        for manifest_path in Path('.').rglob('manifest.json'):
            plugin_dir = manifest_path.parent

            # Skip example plugins
            if 'example' in str(plugin_dir):
                continue

            # Calculate checksum
            checksum = calculate_checksum(plugin_dir)

            # Update manifest
            with open(manifest_path, 'r') as f:
                manifest = json.load(f)

            manifest['checksum_sha256'] = checksum

            with open(manifest_path, 'w') as f:
                json.dump(manifest, f, indent=2)

            print(f"✅ {plugin_dir.name}: {checksum}")
        EOF

    - name: Commit updated checksums
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add '**/manifest.json'
        git diff --staged --quiet || git commit -m "chore: Update plugin checksums [skip ci]"
        git push

  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release:')
    needs: [generate-checksums]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version from commit message
      id: version
      run: |
        VERSION=$(echo "${{ github.event.head_commit.message }}" | grep -oP 'release: v\K[0-9]+\.[0-9]+\.[0-9]+')
        echo "version=v$VERSION" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        release_name: Release ${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
