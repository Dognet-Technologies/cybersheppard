name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-validation:
    name: Validate PR
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check PR title format
      run: |
        PR_TITLE="${{ github.event.pull_request.title }}"

        # Check if title starts with conventional commit type
        if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|perf):'; then
          echo "❌ PR title must start with conventional commit type (feat|fix|docs|style|refactor|test|chore|perf):"
          echo "   Example: 'feat: Add new plugin for Nessus integration'"
          exit 1
        fi

        echo "✅ PR title format is valid"

    - name: Check target branch
      run: |
        TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"

        if [ "$TARGET_BRANCH" != "develop" ]; then
          echo "⚠️  Warning: PRs should typically target 'develop' branch"
          echo "   Current target: $TARGET_BRANCH"
          echo "   If this is intentional (e.g., hotfix), you can ignore this warning"
        else
          echo "✅ Targeting correct branch: develop"
        fi

    - name: Check for new plugins
      id: check-new-plugins
      run: |
        # Get list of changed files
        git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD > changed_files.txt

        # Check for new manifest.json files
        NEW_PLUGINS=$(grep 'manifest.json$' changed_files.txt | grep -v '^D' || true)

        if [ -n "$NEW_PLUGINS" ]; then
          echo "has_new_plugins=true" >> $GITHUB_OUTPUT
          echo "New plugins detected:"
          echo "$NEW_PLUGINS"
        else
          echo "has_new_plugins=false" >> $GITHUB_OUTPUT
          echo "No new plugins detected"
        fi

    - name: Validate new plugin structure
      if: steps.check-new-plugins.outputs.has_new_plugins == 'true'
      run: |
        python3 << 'EOF'
        import sys
        from pathlib import Path

        def validate_plugin_structure(manifest_path):
            plugin_dir = Path(manifest_path).parent
            plugin_name = plugin_dir.name

            print(f"\n📦 Validating plugin: {plugin_name}")

            required_files = ['manifest.json', 'README.md']
            optional_files = ['requirements.txt', 'Cargo.toml']

            # Check for entry point (plugin.py or plugin.rs)
            has_python = (plugin_dir / 'plugin.py').exists()
            has_rust = (plugin_dir / 'plugin.rs').exists() or (plugin_dir / 'src' / 'lib.rs').exists()

            if not (has_python or has_rust):
                print(f"  ❌ Missing entry point (plugin.py or plugin.rs)")
                return False

            # Check required files
            for file in required_files:
                if not (plugin_dir / file).exists():
                    print(f"  ❌ Missing required file: {file}")
                    return False
                print(f"  ✅ Found: {file}")

            # Check for tests directory
            if not (plugin_dir / 'tests').exists():
                print(f"  ⚠️  Warning: No tests directory found")
            else:
                print(f"  ✅ Found: tests/")

            # Check README has minimum sections
            readme = (plugin_dir / 'README.md').read_text()
            required_sections = ['Installation', 'Configuration', 'Usage']

            for section in required_sections:
                if f"# {section}" not in readme and f"## {section}" not in readme:
                    print(f"  ⚠️  Warning: README missing section: {section}")

            print(f"  ✅ Plugin structure is valid")
            return True

        # Read changed files
        with open('changed_files.txt', 'r') as f:
            changed = [line.strip() for line in f if 'manifest.json' in line]

        if not changed:
            print("No manifest files changed")
            sys.exit(0)

        all_valid = all(validate_plugin_structure(m) for m in changed)
        sys.exit(0 if all_valid else 1)
        EOF

    - name: Check file sizes
      run: |
        # Plugins should be reasonably sized
        find . -type f -size +10M | while read file; do
          echo "⚠️  Large file detected: $file ($(du -h "$file" | cut -f1))"
          echo "   Consider using external storage or compression"
        done

    - name: Check for sensitive data
      run: |
        # Check for potential secrets or credentials
        PATTERNS=(
          "password.*=.*['\"]"
          "api[_-]?key.*=.*['\"]"
          "secret.*=.*['\"]"
          "token.*=.*['\"]"
          "AWS_.*=.*"
          "GITHUB_TOKEN"
        )

        FOUND_SECRETS=false

        for pattern in "${PATTERNS[@]}"; do
          if grep -r -i -E "$pattern" . --exclude-dir=.git --exclude-dir=node_modules 2>/dev/null; then
            echo "⚠️  Potential secret found matching pattern: $pattern"
            FOUND_SECRETS=true
          fi
        done

        if [ "$FOUND_SECRETS" = true ]; then
          echo ""
          echo "❌ Potential hardcoded secrets detected!"
          echo "   Please ensure no credentials are committed to the repository"
          echo "   Use configuration schema with 'sensitive: true' instead"
          exit 1
        fi

        echo "✅ No hardcoded secrets detected"

  code-quality:
    name: Code Quality Report
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate code statistics
      run: |
        echo "## Code Statistics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Count lines of code
        echo "### Lines of Code" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        find . -name "*.py" -o -name "*.rs" | xargs wc -l | tail -1 >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Count plugins
        CYBERSHEPPARD_PLUGINS=$(find cybersheppard -name "manifest.json" 2>/dev/null | wc -l)
        SENTINELCORE_PLUGINS=$(find sentinelcore -name "manifest.json" 2>/dev/null | wc -l)

        echo "### Plugin Count" >> $GITHUB_STEP_SUMMARY
        echo "- CyberSheppard: $CYBERSHEPPARD_PLUGINS plugins" >> $GITHUB_STEP_SUMMARY
        echo "- SentinelCore: $SENTINELCORE_PLUGINS plugins" >> $GITHUB_STEP_SUMMARY
        echo "- **Total**: $((CYBERSHEPPARD_PLUGINS + SENTINELCORE_PLUGINS)) plugins" >> $GITHUB_STEP_SUMMARY

  label-pr:
    name: Auto-label PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Label based on files changed
      uses: actions/labeler@v5
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        configuration-path: .github/labeler.yml

  comment-checklist:
    name: Post Checklist Comment
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    permissions:
      pull-requests: write

    steps:
    - name: Post checklist comment
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## Plugin Submission Checklist

          Thank you for contributing! Please ensure your plugin meets the following requirements:

          ### Code Quality
          - [ ] Code follows style guidelines (PEP 8 for Python, rustfmt for Rust)
          - [ ] All linting checks pass (pylint score > 8.0, clippy with no warnings)
          - [ ] Code is well-documented with comments and docstrings

          ### Testing
          - [ ] Unit tests included with >70% coverage
          - [ ] Integration tests for external API calls
          - [ ] All tests pass locally

          ### Documentation
          - [ ] README.md is complete and clear
          - [ ] manifest.json includes all required fields
          - [ ] Configuration options are documented
          - [ ] Usage examples provided

          ### Security
          - [ ] No hardcoded credentials or secrets
          - [ ] All sensitive config marked with \`sensitive: true\`
          - [ ] Input validation implemented
          - [ ] Proper error handling

          ### Plugin Structure
          - [ ] manifest.json is valid JSON
          - [ ] README.md includes Installation, Configuration, and Usage sections
          - [ ] tests/ directory exists with test files
          - [ ] requirements.txt or Cargo.toml present

          ### Functionality
          - [ ] Plugin works as described
          - [ ] Event handling implemented correctly
          - [ ] Health check endpoint works
          - [ ] Graceful shutdown implemented

          ---

          The CI/CD pipeline will automatically check many of these items. Please review the results and address any failures.`
          })
