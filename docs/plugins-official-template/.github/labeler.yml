# Auto-labeling configuration for pull requests

'plugin:cybersheppard':
  - cybersheppard/**/*

'plugin:sentinelcore':
  - sentinelcore/**/*

'type:new-plugin':
  - any:
    - changed-files:
      - added-files:
        - '**/manifest.json'

'type:bug-fix':
  - head-branch: ['^fix/', 'fix-']

'type:feature':
  - head-branch: ['^feat/', 'feature-', '^feature/']

'type:documentation':
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.md'
      - 'docs/**/*'

'needs:review':
  - changed-files:
    - any-glob-to-any-file:
      - '**/manifest.json'
      - '**/*.py'
      - '**/*.rs'

'size:small':
  - changed-files:
    - count: 1-10

'size:medium':
  - changed-files:
    - count: 11-50

'size:large':
  - changed-files:
    - count: 51-
