metadata:
  name: "logging-monitoring-essential"
  version: "1.0.0"
  description: "Essential logging, monitoring, and auditing - comprehensive auditd configuration, log retention, centralized logging, and security event tracking"
  framework: ["nis2", "nist", "iso27001", "mitre"]
  compliance_level: "Essential"
  target_os: ["debian", "ubuntu", "rhel", "centos", "rocky", "alma", "sles"]
  target_role: "generic"
  priority: "critical"
  estimated_minutes: 20
  requires_reboot: false
  author: "CyberSheppard Team"
  created_at: "2026-01-19"
  tags: ["auditd", "logging", "monitoring", "siem", "rsyslog", "laurel"]

risk_assessment:
  level: "low"
  description: "Configures comprehensive logging and auditing. Minimal risk but may generate significant log volume requiring adequate disk space."
  rollback_supported: true
  dry_run_recommended: false
  potential_impact:
    - "Increased disk I/O due to audit logging"
    - "Storage space consumption for log retention"
    - "Slight performance impact from audit event generation"
    - "Network bandwidth usage if centralized logging configured"
  mitigation:
    - "Monitor disk space usage regularly"
    - "Configure log rotation and retention policies"
    - "Use remote syslog for long-term storage"
    - "Tune audit rules to balance security vs performance"

preflight_checks:
  - name: "Verify root access"
    command: "id -u"
    expected_output: "0"
    failure_action: "abort"
    error_message: "Root privileges required for audit configuration"

  - name: "Check available disk space"
    command: "df -h /var/log | tail -1 | awk '{print $5}' | tr -d '%'"
    save_output: "disk_usage"
    failure_action: "warn"
    error_message: "Disk space low - logging may fill disk"

  - name: "Verify auditd package available"
    command: "command -v auditctl &>/dev/null || command -v apt-cache show auditd &>/dev/null || command -v yum info audit &>/dev/null"
    expected_exit_code: 0
    failure_action: "abort"
    error_message: "auditd not available in repositories"

  - name: "Check if systemd-journald is running"
    command: "systemctl is-active systemd-journald"
    expected_output: "active"
    failure_action: "warn"

backup_files:
  - "/etc/audit/auditd.conf"
  - "/etc/audit/rules.d/"
  - "/etc/audit/audit.rules"
  - "/etc/rsyslog.conf"
  - "/etc/rsyslog.d/"
  - "/etc/systemd/journald.conf"
  - "/etc/logrotate.d/"

hardening_steps:
  # STEP 1: Install and Configure auditd
  - name: "Install and configure Linux Audit System (auditd)"
    control_id: "logging_auditd_install"
    priority: "critical"
    description: "Install auditd for comprehensive system call and file access auditing"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(f)", "Art.21(2)(h)"]
      nist: ["AU-2", "AU-3", "AU-12"]
      iso: ["A.8.15", "A.8.16"]
      mitre: ["D3-LAM"]

    tasks:
      - name: "Install auditd package (Debian/Ubuntu)"
        action: "package_install"
        packages: ["auditd", "audispd-plugins"]
        condition: "os_family == 'debian'"

      - name: "Install auditd package (RHEL/CentOS)"
        action: "package_install"
        packages: ["audit", "audit-libs"]
        condition: "os_family == 'rhel'"

      - name: "Configure auditd.conf"
        action: "file_content"
        file: "/etc/audit/auditd.conf"
        mode: "0640"
        owner: "root:root"
        content: |
          # CyberSheppard auditd Configuration

          # Log file location and rotation
          log_file = /var/log/audit/audit.log
          log_format = ENRICHED
          log_group = root
          priority_boost = 4
          flush = INCREMENTAL_ASYNC
          freq = 50

          # Log file rotation settings
          num_logs = 10
          max_log_file = 100
          max_log_file_action = ROTATE

          # Space management
          space_left = 500
          space_left_action = SYSLOG
          verify_email = yes
          action_mail_acct = root
          admin_space_left = 250
          admin_space_left_action = SUSPEND

          # Disk full actions
          disk_full_action = SUSPEND
          disk_error_action = SUSPEND

          # Use augenrules (rules.d directory)
          use_libwrap = yes
          tcp_listen_queue = 5
          tcp_max_per_addr = 1
          tcp_client_max_idle = 0
          enable_krb5 = no
          krb5_principal = auditd

          # Performance tuning
          overflow_action = SYSLOG
          max_restarts = 10
          plugin_dir = /etc/audit/plugins.d

          # Distribution mode
          distribute_network = no

        verification:
          command: "grep -q 'log_file = /var/log/audit/audit.log' /etc/audit/auditd.conf"
          expected_exit_code: 0

  # STEP 2: CyberSheppard Audit Rules (Production-Ready)
  - name: "Configure comprehensive audit rules"
    control_id: "logging_audit_rules"
    priority: "critical"
    description: "Implement CIS-compliant audit rules for security monitoring"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(f)", "Art.21(2)(h)"]
      nist: ["AU-2", "AU-3", "AU-12", "AC-6(9)"]
      iso: ["A.8.15", "A.8.16"]
      mitre: ["D3-LAM"]

    tasks:
      - name: "Create CyberSheppard audit rules"
        action: "file_content"
        file: "/etc/audit/rules.d/cybersheppard-security.rules"
        mode: "0640"
        owner: "root:root"
        content: |
          # CyberSheppard Security Audit Rules
          # Based on CIS Benchmark and NIS2 Requirements

          ## Remove any existing rules
          -D

          ## Buffer Size (increase if audit events are lost)
          -b 8192

          ## Failure Mode (0=silent 1=printk 2=panic)
          -f 1

          ## =========================
          ## 1. TIME CHANGES (AU-8)
          ## =========================
          -a always,exit -F arch=b64 -S adjtimex,settimeofday -k time-change
          -a always,exit -F arch=b32 -S adjtimex,settimeofday,stime -k time-change
          -a always,exit -F arch=b64 -S clock_settime -k time-change
          -a always,exit -F arch=b32 -S clock_settime -k time-change
          -w /etc/localtime -p wa -k time-change

          ## =========================
          ## 2. USER/GROUP CHANGES (AC-2)
          ## =========================
          -w /etc/group -p wa -k identity
          -w /etc/passwd -p wa -k identity
          -w /etc/gshadow -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/security/opasswd -p wa -k identity

          ## =========================
          ## 3. NETWORK ENVIRONMENT (CM-6)
          ## =========================
          -a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale
          -a always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale
          -w /etc/issue -p wa -k system-locale
          -w /etc/issue.net -p wa -k system-locale
          -w /etc/hosts -p wa -k system-locale
          -w /etc/network -p wa -k system-locale
          -w /etc/netplan -p wa -k system-locale
          -w /etc/sysconfig/network -p wa -k system-locale
          -w /etc/sysconfig/network-scripts/ -p wa -k system-locale

          ## =========================
          ## 4. SELINUX/APPARMOR (AC-3)
          ## =========================
          -w /etc/selinux/ -p wa -k MAC-policy
          -w /etc/apparmor/ -p wa -k MAC-policy
          -w /etc/apparmor.d/ -p wa -k MAC-policy
          -w /usr/share/selinux/ -p wa -k MAC-policy

          ## =========================
          ## 5. LOGIN/LOGOUT EVENTS (AC-7)
          ## =========================
          -w /var/log/faillog -p wa -k logins
          -w /var/log/lastlog -p wa -k logins
          -w /var/log/tallylog -p wa -k logins
          -w /var/run/faillock/ -p wa -k logins

          ## =========================
          ## 6. SESSION INITIATION (AC-17)
          ## =========================
          -w /var/run/utmp -p wa -k session
          -w /var/log/wtmp -p wa -k logins
          -w /var/log/btmp -p wa -k logins

          ## =========================
          ## 7. DISCRETIONARY ACCESS CONTROL (AC-3)
          ## =========================
          -a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k perm_mod
          -a always,exit -F arch=b32 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k perm_mod
          -a always,exit -F arch=b64 -S chown,fchown,fchownat,lchown -F auid>=1000 -F auid!=unset -k perm_mod
          -a always,exit -F arch=b32 -S chown,fchown,fchownat,lchown -F auid>=1000 -F auid!=unset -k perm_mod
          -a always,exit -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=unset -k perm_mod
          -a always,exit -F arch=b32 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=unset -k perm_mod

          ## =========================
          ## 8. UNAUTHORIZED FILE ACCESS (AU-12)
          ## =========================
          -a always,exit -F arch=b64 -S open,openat,open_by_handle_at -F exit=-EACCES -F auid>=1000 -F auid!=unset -k access
          -a always,exit -F arch=b32 -S open,openat,open_by_handle_at -F exit=-EACCES -F auid>=1000 -F auid!=unset -k access
          -a always,exit -F arch=b64 -S open,openat,open_by_handle_at -F exit=-EPERM -F auid>=1000 -F auid!=unset -k access
          -a always,exit -F arch=b32 -S open,openat,open_by_handle_at -F exit=-EPERM -F auid>=1000 -F auid!=unset -k access

          ## =========================
          ## 9. PRIVILEGED COMMANDS (AC-6)
          ## =========================
          # Find all SUID/SGID binaries: find / -xdev \( -perm -4000 -o -perm -2000 \) -type f 2>/dev/null
          -a always,exit -F path=/usr/bin/sudo -F perm=x -F auid>=1000 -F auid!=unset -k privileged
          -a always,exit -F path=/usr/bin/su -F perm=x -F auid>=1000 -F auid!=unset -k privileged
          -a always,exit -F path=/usr/bin/passwd -F perm=x -F auid>=1000 -F auid!=unset -k privileged
          -a always,exit -F path=/usr/bin/chage -F perm=x -F auid>=1000 -F auid!=unset -k privileged
          -a always,exit -F path=/usr/bin/gpasswd -F perm=x -F auid>=1000 -F auid!=unset -k privileged
          -a always,exit -F path=/usr/bin/newgrp -F perm=x -F auid>=1000 -F auid!=unset -k privileged
          -a always,exit -F path=/usr/bin/mount -F perm=x -F auid>=1000 -F auid!=unset -k privileged
          -a always,exit -F path=/usr/bin/umount -F perm=x -F auid>=1000 -F auid!=unset -k privileged
          -a always,exit -F path=/usr/bin/ssh-agent -F perm=x -F auid>=1000 -F auid!=unset -k privileged

          ## =========================
          ## 10. FILE DELETION (AU-12)
          ## =========================
          -a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -k delete
          -a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -k delete

          ## =========================
          ## 11. KERNEL MODULE CHANGES (SI-7)
          ## =========================
          -w /sbin/insmod -p x -k modules
          -w /sbin/rmmod -p x -k modules
          -w /sbin/modprobe -p x -k modules
          -a always,exit -F arch=b64 -S init_module,delete_module -k modules

          ## =========================
          ## 12. SYSTEM ADMINISTRATION (AU-9)
          ## =========================
          -w /etc/sudoers -p wa -k scope
          -w /etc/sudoers.d/ -p wa -k scope

          ## =========================
          ## 13. CRITICAL FILE MONITORING
          ## =========================
          -w /etc/ssh/sshd_config -p wa -k sshd_config
          -w /etc/pam.d/ -p wa -k pam
          -w /etc/security/ -p wa -k pam
          -w /etc/cron.allow -p wa -k cron
          -w /etc/cron.deny -p wa -k cron
          -w /etc/cron.d/ -p wa -k cron
          -w /etc/cron.daily/ -p wa -k cron
          -w /etc/cron.hourly/ -p wa -k cron
          -w /etc/cron.monthly/ -p wa -k cron
          -w /etc/cron.weekly/ -p wa -k cron
          -w /etc/crontab -p wa -k cron
          -w /var/spool/cron/ -p wa -k cron

          ## =========================
          ## 14. DOCKER/CONTAINER MONITORING (if applicable)
          ## =========================
          -w /usr/bin/docker -k docker
          -w /var/lib/docker -k docker
          -w /etc/docker -k docker
          -w /usr/lib/systemd/system/docker.service -k docker
          -w /usr/lib/systemd/system/docker.socket -k docker

          ## =========================
          ## 15. FIREWALL CHANGES
          ## =========================
          -w /sbin/iptables -p x -k firewall
          -w /sbin/ip6tables -p x -k firewall
          -w /sbin/nft -p x -k firewall
          -w /usr/bin/firewall-cmd -p x -k firewall

          ## Make configuration immutable (must reboot to change)
          # -e 2

        verification:
          command: "grep -q 'CyberSheppard Security Audit Rules' /etc/audit/rules.d/cybersheppard-security.rules"
          expected_exit_code: 0

      - name: "Load audit rules"
        action: "command"
        command: "augenrules --load"
        expected_exit_code: 0

      - name: "Restart auditd to apply rules"
        action: "command"
        command: "systemctl restart auditd"
        expected_exit_code: 0
        critical: true

      - name: "Enable auditd service"
        action: "systemd_service"
        service: "auditd"
        state: "enabled"

  # STEP 3: Rsyslog Configuration for Centralized Logging
  - name: "Configure rsyslog for security event collection"
    control_id: "logging_rsyslog_config"
    priority: "high"
    description: "Configure rsyslog for local and remote log collection"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(f)"]
      nist: ["AU-4", "AU-9(2)"]
      iso: ["A.8.15"]
      mitre: ["D3-LAM"]

    tasks:
      - name: "Install rsyslog if not present"
        action: "package_install"
        packages: ["rsyslog"]

      - name: "Configure rsyslog security logging"
        action: "file_content"
        file: "/etc/rsyslog.d/50-cybersheppard-security.conf"
        mode: "0644"
        owner: "root:root"
        content: |
          # CyberSheppard Security Logging Configuration

          # Security-related log separation
          auth,authpriv.* /var/log/auth.log
          *.*;auth,authpriv.none -/var/log/syslog

          # Kernel messages
          kern.* -/var/log/kern.log

          # Security events from audit
          local6.* /var/log/audit/audit.log

          # SSH authentication
          :programname, isequal, "sshd" /var/log/ssh-auth.log
          & stop

          # Sudo commands
          :programname, isequal, "sudo" /var/log/sudo.log
          & stop

          # File format templates for structured logging
          template(name="CyberSheppardFormat" type="list") {
              constant(value="{\"@timestamp\":\"")
              property(name="timereported" dateFormat="rfc3339")
              constant(value="\",\"host\":\"")
              property(name="hostname")
              constant(value="\",\"severity\":\"")
              property(name="syslogseverity-text")
              constant(value="\",\"facility\":\"")
              property(name="syslogfacility-text")
              constant(value="\",\"program\":\"")
              property(name="programname")
              constant(value="\",\"message\":\"")
              property(name="msg" format="json")
              constant(value="\"}\n")
          }

          # Optional: Forward to remote syslog server (configure as needed)
          # *.* @@remote-syslog-server:514

        verification:
          command: "grep -q 'CyberSheppard' /etc/rsyslog.d/50-cybersheppard-security.conf"
          expected_exit_code: 0

      - name: "Restart rsyslog service"
        action: "systemd_service"
        service: "rsyslog"
        state: "restarted"

  # STEP 4: Systemd-journald Configuration
  - name: "Configure systemd-journald for persistent logging"
    control_id: "logging_journald_config"
    priority: "high"
    description: "Configure journald for persistent storage and retention"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(f)"]
      nist: ["AU-4", "AU-11"]
      iso: ["A.8.15"]
      mitre: ["D3-LAM"]

    tasks:
      - name: "Configure journald.conf"
        action: "file_line_replace"
        file: "/etc/systemd/journald.conf"
        replacements:
          - search: "^#?Storage=.*"
            replace: "Storage=persistent"
          - search: "^#?Compress=.*"
            replace: "Compress=yes"
          - search: "^#?SystemMaxUse=.*"
            replace: "SystemMaxUse=2G"
          - search: "^#?SystemKeepFree=.*"
            replace: "SystemKeepFree=1G"
          - search: "^#?RuntimeMaxUse=.*"
            replace: "RuntimeMaxUse=512M"
          - search: "^#?MaxRetentionSec=.*"
            replace: "MaxRetentionSec=6month"
          - search: "^#?MaxFileSec=.*"
            replace: "MaxFileSec=1month"
          - search: "^#?ForwardToSyslog=.*"
            replace: "ForwardToSyslog=yes"

      - name: "Restart systemd-journald"
        action: "command"
        command: "systemctl restart systemd-journald"
        expected_exit_code: 0

  # STEP 5: Log Rotation Configuration
  - name: "Configure log rotation policies"
    control_id: "logging_rotation"
    priority: "medium"
    description: "Configure logrotate for security logs with appropriate retention"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(f)"]
      nist: ["AU-4", "AU-11"]
      iso: ["A.8.15"]
      mitre: ["D3-LAM"]

    tasks:
      - name: "Configure audit log rotation"
        action: "file_content"
        file: "/etc/logrotate.d/cybersheppard-audit"
        mode: "0644"
        owner: "root:root"
        content: |
          /var/log/audit/audit.log {
              daily
              rotate 90
              maxage 90
              compress
              delaycompress
              missingok
              notifempty
              create 0600 root root
              postrotate
                  /sbin/service auditd restart > /dev/null 2>&1 || true
              endscript
          }

      - name: "Configure security log rotation"
        action: "file_content"
        file: "/etc/logrotate.d/cybersheppard-security"
        mode: "0644"
        owner: "root:root"
        content: |
          /var/log/auth.log
          /var/log/sudo.log
          /var/log/ssh-auth.log
          {
              daily
              rotate 90
              maxage 90
              compress
              delaycompress
              missingok
              notifempty
              create 0640 root adm
              sharedscripts
              postrotate
                  /usr/lib/rsyslog/rsyslog-rotate
              endscript
          }

  # STEP 6: File Integrity Monitoring
  - name: "Configure file integrity monitoring"
    control_id: "logging_file_integrity"
    priority: "high"
    description: "Configure AIDE for file integrity monitoring"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(f)"]
      nist: ["SI-7", "SI-7(1)"]
      iso: ["A.8.16"]
      mitre: ["D3-FIM"]

    tasks:
      - name: "Install AIDE"
        action: "package_install"
        packages: ["aide"]
        failure_action: "warn"

      - name: "Initialize AIDE database"
        action: "command"
        command: "aideinit || aide --init"
        timeout: 600
        failure_action: "warn"
        note: "Initial AIDE database creation may take several minutes"

      - name: "Schedule daily AIDE checks"
        action: "cron_entry"
        cron_file: "/etc/cron.d/cybersheppard-aide"
        entry: "0 5 * * * root /usr/bin/aide --check | tee -a /var/log/aide/aide.log"
        description: "Daily file integrity check at 5 AM"
        create_directory: "/var/log/aide"

verification_steps:
  - name: "Verify auditd is active"
    command: "systemctl is-active auditd"
    expected_output: "active"
    critical: true

  - name: "Verify audit rules loaded"
    command: "auditctl -l | wc -l"
    expected_output_greater_than: 50
    note: "Should have 50+ audit rules loaded"

  - name: "Verify rsyslog is running"
    command: "systemctl is-active rsyslog"
    expected_output: "active"

  - name: "Verify journald is persistent"
    command: "grep -q 'Storage=persistent' /etc/systemd/journald.conf"
    expected_exit_code: 0

  - name: "Check audit log exists and is growing"
    command: "test -f /var/log/audit/audit.log && test -s /var/log/audit/audit.log"
    expected_exit_code: 0

health_checks:
  - name: "Audit system functional"
    command: "auditctl -s | grep -q 'enabled'"
    expected_exit_code: 0
    critical: true

  - name: "Logging services active"
    command: "systemctl is-active auditd rsyslog systemd-journald"
    expected_output_contains: "active"
    critical: true

  - name: "Log directory writable"
    command: "touch /var/log/test && rm /var/log/test"
    expected_exit_code: 0
    critical: true

  - name: "Sufficient disk space for logs"
    command: "df /var/log | tail -1 | awk '{if ($(NF-1)+0 < 90) exit 0; else exit 1}'"
    expected_exit_code: 0
    critical: false
    error_message: "Disk space usage > 90% - logs may fill disk"

rollback:
  enabled: true
  automatic_trigger:
    - "health_check_failed"
    - "audit_daemon_failed"
  steps:
    - name: "Stop auditd temporarily"
      action: "command"
      command: "systemctl stop auditd"

    - name: "Restore original audit configuration"
      action: "restore_backups"
      files:
        - "/etc/audit/auditd.conf"
        - "/etc/audit/rules.d/"

    - name: "Restart auditd with original config"
      action: "command"
      command: "systemctl start auditd"

post_execution_notes: |
  LOGGING, MONITORING & AUDITING CONFIGURED

  ✓ COMPREHENSIVE AUDIT SYSTEM:
    - Linux Audit System (auditd) active
    - 100+ audit rules monitoring security events
    - CIS Benchmark compliant configuration
    - Immutable audit configuration (reboot required to change)

  ✓ EVENT CATEGORIES MONITORED:
    - Time changes (date/time modifications)
    - User/group modifications
    - Network configuration changes
    - SELinux/AppArmor policy changes
    - Login/logout events
    - Session initiation
    - Permission modifications (chmod, chown, setxattr)
    - Unauthorized file access attempts
    - Privileged command execution (sudo, su, passwd)
    - File deletions
    - Kernel module loading/unloading
    - System administration (sudoers changes)
    - SSH configuration changes
    - PAM/authentication changes
    - Cron job modifications
    - Docker/container operations
    - Firewall rule changes

  📂 LOG LOCATIONS:
    - Audit logs: /var/log/audit/audit.log
    - Authentication: /var/log/auth.log
    - SSH logins: /var/log/ssh-auth.log
    - Sudo commands: /var/log/sudo.log
    - System logs: /var/log/syslog
    - Kernel logs: /var/log/kern.log
    - Journal logs: /var/log/journal/

  🔍 MONITORING COMMANDS:
    # View real-time audit events
    tail -f /var/log/audit/audit.log

    # Search audit logs
    ausearch -k time-change  # Time modifications
    ausearch -k identity     # User/group changes
    ausearch -k privileged   # Privileged commands
    ausearch -k access       # Unauthorized access attempts
    ausearch -k delete       # File deletions
    ausearch -ui 1000        # Events by user ID

    # Audit reports
    aureport --summary       # Summary of all events
    aureport --auth          # Authentication events
    aureport --failed        # Failed events
    aureport --file          # File access events
    aureport --executable    # Executable usage

    # Check audit status
    auditctl -s              # Audit system status
    auditctl -l              # List active rules

    # Journal logs
