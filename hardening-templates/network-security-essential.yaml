metadata:
  name: "network-security-essential"
  version: "1.0.0"
  description: "Essential network security and segmentation - firewall configuration, port restrictions, network isolation, and traffic filtering"
  framework: ["nis2", "nist", "iso27001", "mitre"]
  compliance_level: "Essential"
  target_os: ["debian", "ubuntu", "rhel", "centos", "rocky", "alma", "sles"]
  target_role: "generic"
  priority: "critical"
  estimated_minutes: 20
  requires_reboot: false
  author: "CyberSheppard Team"
  created_at: "2026-01-19"
  tags: ["firewall", "iptables", "nftables", "firewalld", "network", "segmentation"]

risk_assessment:
  level: "high"
  description: "Configures host-based firewall and restricts network access. May break network connectivity or block legitimate services if not properly configured."
  rollback_supported: true
  dry_run_recommended: true
  potential_impact:
    - "Network services may become inaccessible if ports are incorrectly blocked"
    - "SSH access may be lost if firewall rules are misconfigured"
    - "Application connectivity may fail if required ports not whitelisted"
    - "Management/monitoring tools may lose connectivity"
  mitigation:
    - "CRITICAL: Maintain console/serial access during deployment"
    - "Test firewall rules before applying"
    - "Keep emergency access method available"
    - "Start with permissive rules, then tighten incrementally"
    - "Verify SSH port is allowed before enabling firewall"

preflight_checks:
  - name: "Verify root access"
    command: "id -u"
    expected_output: "0"
    failure_action: "abort"
    error_message: "Root privileges required for firewall configuration"

  - name: "Detect firewall system"
    command: |
      if systemctl is-active firewalld &>/dev/null; then
        echo "firewalld"
      elif command -v nft &>/dev/null && nft list ruleset &>/dev/null; then
        echo "nftables"
      elif command -v iptables &>/dev/null; then
        echo "iptables"
      elif command -v ufw &>/dev/null; then
        echo "ufw"
      else
        echo "none"
        exit 1
      fi
    save_output: "firewall_system"
    failure_action: "abort"
    error_message: "No supported firewall system detected"

  - name: "Verify SSH current connection port"
    command: "ss -tlnp | grep sshd | grep -oE ':[0-9]+' | head -1 | tr -d ':'"
    save_output: "ssh_port"
    expected_exit_code: 0
    failure_action: "abort"
    error_message: "Cannot detect SSH port - aborting to prevent lockout"

  - name: "Check if running in container"
    command: "systemd-detect-virt"
    save_output: "virtualization_type"
    failure_action: "warn"
    error_message: "Running in container - firewall configuration may have limited effect"

  - name: "Verify network interfaces present"
    command: "ip link show | grep -E '^[0-9]+:' | wc -l"
    expected_exit_code: 0
    failure_action: "warn"

backup_files:
  - "/etc/iptables/rules.v4"
  - "/etc/iptables/rules.v6"
  - "/etc/nftables.conf"
  - "/etc/firewalld/zones/"
  - "/etc/ufw/ufw.conf"
  - "/etc/ufw/user.rules"
  - "/etc/sysctl.d/99-cybersheppard-network.conf"

hardening_steps:
  # STEP 1: Network Stack Hardening (sysctl)
  - name: "Harden network stack parameters"
    control_id: "network_stack_hardening"
    priority: "critical"
    description: "Configure kernel network parameters for security (IP forwarding, ICMP, etc.)"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(a)", "Art.21(2)(c)"]
      nist: ["SC-7", "SC-7(5)", "SC-5"]
      iso: ["A.8.20", "A.8.21"]
      mitre: ["D3-NTF", "D3-ANCI"]

    tasks:
      - name: "Configure network security sysctl parameters"
        action: "file_content"
        file: "/etc/sysctl.d/99-cybersheppard-network.conf"
        mode: "0644"
        owner: "root:root"
        content: |
          # CyberSheppard Network Security Configuration

          # IP Forwarding - Disable unless router
          net.ipv4.ip_forward = 0
          net.ipv6.conf.all.forwarding = 0

          # IP Spoofing Protection
          net.ipv4.conf.all.rp_filter = 1
          net.ipv4.conf.default.rp_filter = 1

          # Source Route Protection
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv4.conf.default.accept_source_route = 0
          net.ipv6.conf.all.accept_source_route = 0
          net.ipv6.conf.default.accept_source_route = 0

          # ICMP Redirect Protection
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
          net.ipv6.conf.all.accept_redirects = 0
          net.ipv6.conf.default.accept_redirects = 0
          net.ipv4.conf.all.secure_redirects = 0
          net.ipv4.conf.default.secure_redirects = 0

          # Do not send ICMP redirects
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0

          # SYN Flood Protection
          net.ipv4.tcp_syncookies = 1
          net.ipv4.tcp_max_syn_backlog = 2048
          net.ipv4.tcp_synack_retries = 2
          net.ipv4.tcp_syn_retries = 5

          # Log Martian Packets
          net.ipv4.conf.all.log_martians = 1
          net.ipv4.conf.default.log_martians = 1

          # Ignore ICMP ping requests (optional - may break monitoring)
          # net.ipv4.icmp_echo_ignore_all = 1

          # Ignore broadcast ICMP requests
          net.ipv4.icmp_echo_ignore_broadcasts = 1

          # Ignore bogus ICMP error responses
          net.ipv4.icmp_ignore_bogus_error_responses = 1

          # IPv6 Router Advertisements
          net.ipv6.conf.all.accept_ra = 0
          net.ipv6.conf.default.accept_ra = 0

          # TCP Timestamps (can be used for OS fingerprinting)
          net.ipv4.tcp_timestamps = 0

        verification:
          command: "grep -q 'net.ipv4.conf.all.rp_filter = 1' /etc/sysctl.d/99-cybersheppard-network.conf"
          expected_exit_code: 0

      - name: "Apply network sysctl parameters"
        action: "command"
        command: "sysctl -p /etc/sysctl.d/99-cybersheppard-network.conf"
        expected_exit_code: 0

  # STEP 2: Firewalld Configuration (RHEL/CentOS default)
  - name: "Configure firewalld (RHEL/CentOS)"
    control_id: "network_firewalld_config"
    priority: "critical"
    description: "Configure firewalld with secure default zone and rules"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(a)"]
      nist: ["SC-7", "SC-7(5)", "CA-3(5)"]
      iso: ["A.8.20"]
      mitre: ["D3-NTF"]
    condition: "firewall_system == 'firewalld'"

    tasks:
      - name: "Install firewalld if not present"
        action: "package_install"
        packages: ["firewalld"]
        condition: "not command_exists('firewall-cmd')"

      - name: "Enable firewalld service"
        action: "systemd_service"
        service: "firewalld"
        state: "enabled"

      - name: "Start firewalld"
        action: "command"
        command: "systemctl start firewalld"
        expected_exit_code: 0

      - name: "Set default zone to drop"
        action: "command"
        command: "firewall-cmd --set-default-zone=drop"
        expected_exit_code: 0
        note: "Drop all traffic by default, then whitelist specific services"

      - name: "Create trusted internal zone"
        action: "command"
        command: "firewall-cmd --permanent --new-zone=internal || true"
        expected_exit_code: 0

      - name: "Allow SSH in public zone"
        action: "command"
        command: "firewall-cmd --permanent --zone=public --add-service=ssh"
        expected_exit_code: 0
        critical: true
        note: "CRITICAL: Ensure SSH is allowed before enabling firewall"

      - name: "Allow SSH port explicitly"
        action: "command"
        command: "firewall-cmd --permanent --zone=public --add-port=${ssh_port}/tcp"
        expected_exit_code: 0
        critical: true

      - name: "Configure rate limiting for SSH"
        action: "command"
        command: "firewall-cmd --permanent --zone=public --add-rich-rule='rule service name=ssh limit value=10/m accept'"
        expected_exit_code: 0
        note: "Rate limit SSH to 10 connections per minute"

      - name: "Block common attack ports"
        action: "script"
        script: |
          #!/bin/bash
          # Block commonly attacked ports
          for port in 23 25 135 139 445 1433 3306 3389; do
            firewall-cmd --permanent --zone=public --add-rich-rule="rule family=ipv4 port port=$port protocol=tcp reject"
          done
          exit 0

      - name: "Enable firewall logging for denied packets"
        action: "command"
        command: "firewall-cmd --permanent --set-log-denied=all"
        expected_exit_code: 0

      - name: "Reload firewalld configuration"
        action: "command"
        command: "firewall-cmd --reload"
        expected_exit_code: 0
        critical: true

      - name: "Verify firewalld is active"
        action: "command"
        command: "firewall-cmd --state"
        expected_output: "running"
        critical: true

  # STEP 3: iptables Configuration (Debian/Ubuntu)
  - name: "Configure iptables (Debian/Ubuntu)"
    control_id: "network_iptables_config"
    priority: "critical"
    description: "Configure iptables with secure default-deny rules"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(a)"]
      nist: ["SC-7", "SC-7(5)"]
      iso: ["A.8.20"]
      mitre: ["D3-NTF"]
    condition: "firewall_system == 'iptables'"

    tasks:
      - name: "Install iptables-persistent"
        action: "package_install"
        packages: ["iptables-persistent", "netfilter-persistent"]
        condition: "os_family == 'debian'"

      - name: "Flush existing rules"
        action: "command"
        command: "iptables -F && iptables -X && iptables -t nat -F && iptables -t nat -X && iptables -t mangle -F && iptables -t mangle -X"
        expected_exit_code: 0

      - name: "Set default policies to DROP"
        action: "command"
        command: "iptables -P INPUT DROP && iptables -P FORWARD DROP && iptables -P OUTPUT ACCEPT"
        expected_exit_code: 0
        critical: true
        note: "Default deny for incoming, allow outgoing"

      - name: "Allow loopback traffic"
        action: "command"
        command: "iptables -A INPUT -i lo -j ACCEPT && iptables -A OUTPUT -o lo -j ACCEPT"
        expected_exit_code: 0

      - name: "Allow established and related connections"
        action: "command"
        command: "iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT"
        expected_exit_code: 0

      - name: "Allow SSH with rate limiting"
        action: "command"
        command: "iptables -A INPUT -p tcp --dport ${ssh_port} -m conntrack --ctstate NEW -m recent --set && iptables -A INPUT -p tcp --dport ${ssh_port} -m conntrack --ctstate NEW -m recent --update --seconds 60 --hitcount 10 -j DROP && iptables -A INPUT -p tcp --dport ${ssh_port} -j ACCEPT"
        expected_exit_code: 0
        critical: true
        note: "Allow SSH but limit to 10 new connections per minute"

      - name: "Drop invalid packets"
        action: "command"
        command: "iptables -A INPUT -m conntrack --ctstate INVALID -j DROP"
        expected_exit_code: 0

      - name: "Protect against SYN floods"
        action: "command"
        command: "iptables -A INPUT -p tcp --syn -m limit --limit 1/s --limit-burst 3 -j ACCEPT && iptables -A INPUT -p tcp --syn -j DROP"
        expected_exit_code: 0

      - name: "Drop fragmented packets"
        action: "command"
        command: "iptables -A INPUT -f -j DROP"
        expected_exit_code: 0

      - name: "Drop XMAS packets"
        action: "command"
        command: "iptables -A INPUT -p tcp --tcp-flags ALL ALL -j DROP"
        expected_exit_code: 0

      - name: "Drop NULL packets"
        action: "command"
        command: "iptables -A INPUT -p tcp --tcp-flags ALL NONE -j DROP"
        expected_exit_code: 0

      - name: "Log dropped packets (limited)"
        action: "command"
        command: "iptables -A INPUT -m limit --limit 5/min -j LOG --log-prefix 'iptables-dropped: ' --log-level 4"
        expected_exit_code: 0

      - name: "Save iptables rules"
        action: "command"
        command: "iptables-save > /etc/iptables/rules.v4 || netfilter-persistent save"
        expected_exit_code: 0

      - name: "Enable netfilter-persistent service"
        action: "systemd_service"
        service: "netfilter-persistent"
        state: "enabled"
        condition: "service_exists('netfilter-persistent')"

  # STEP 4: UFW Configuration (Ubuntu alternative)
  - name: "Configure UFW (Ubuntu)"
    control_id: "network_ufw_config"
    priority: "critical"
    description: "Configure UFW with secure default-deny rules"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(a)"]
      nist: ["SC-7"]
      iso: ["A.8.20"]
      mitre: ["D3-NTF"]
    condition: "firewall_system == 'ufw'"

    tasks:
      - name: "Install UFW if not present"
        action: "package_install"
        packages: ["ufw"]
        condition: "not command_exists('ufw')"

      - name: "Reset UFW to defaults"
        action: "command"
        command: "ufw --force reset"
        expected_exit_code: 0

      - name: "Set default policies"
        action: "command"
        command: "ufw default deny incoming && ufw default allow outgoing && ufw default deny routed"
        expected_exit_code: 0

      - name: "Allow SSH before enabling"
        action: "command"
        command: "ufw allow ${ssh_port}/tcp comment 'SSH access'"
        expected_exit_code: 0
        critical: true

      - name: "Rate limit SSH"
        action: "command"
        command: "ufw limit ${ssh_port}/tcp comment 'SSH rate limit'"
        expected_exit_code: 0

      - name: "Enable logging"
        action: "command"
        command: "ufw logging medium"
        expected_exit_code: 0

      - name: "Enable UFW"
        action: "command"
        command: "ufw --force enable"
        expected_exit_code: 0
        critical: true

      - name: "Verify UFW is active"
        action: "command"
        command: "ufw status | grep -q 'Status: active'"
        expected_exit_code: 0
        critical: true

  # STEP 5: IPv6 Firewall Configuration
  - name: "Configure IPv6 firewall rules"
    control_id: "network_ipv6_firewall"
    priority: "high"
    description: "Apply same firewall restrictions to IPv6 traffic"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(a)"]
      nist: ["SC-7"]
      iso: ["A.8.20"]
      mitre: ["D3-NTF"]
    condition: "ipv6_enabled()"

    tasks:
      - name: "Configure ip6tables (if iptables system)"
        action: "script"
        script: |
          #!/bin/bash
          if [ "${firewall_system}" = "iptables" ]; then
            # Set default policies
            ip6tables -P INPUT DROP
            ip6tables -P FORWARD DROP
            ip6tables -P OUTPUT ACCEPT

            # Allow loopback
            ip6tables -A INPUT -i lo -j ACCEPT

            # Allow established connections
            ip6tables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT

            # Allow SSH with rate limiting
            ip6tables -A INPUT -p tcp --dport ${ssh_port} -m conntrack --ctstate NEW -m recent --set
            ip6tables -A INPUT -p tcp --dport ${ssh_port} -m conntrack --ctstate NEW -m recent --update --seconds 60 --hitcount 10 -j DROP
            ip6tables -A INPUT -p tcp --dport ${ssh_port} -j ACCEPT

            # Allow ICMPv6 (essential for IPv6)
            ip6tables -A INPUT -p ipv6-icmp -j ACCEPT

            # Save rules
            ip6tables-save > /etc/iptables/rules.v6 || netfilter-persistent save
          fi
          exit 0
        condition: "firewall_system == 'iptables'"

  # STEP 6: Network Segmentation Documentation
  - name: "Document network segmentation requirements"
    control_id: "network_segmentation"
    priority: "medium"
    description: "Document current network interfaces and segmentation status"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(a)"]
      nist: ["SC-7(21)", "AC-4(21)"]
      iso: ["A.8.20", "A.8.21"]
      mitre: ["D3-NI"]

    tasks:
      - name: "Generate network segmentation report"
        action: "script"
        script: |
          #!/bin/bash
          report_file="/var/log/cybersheppard/network-segmentation-report.txt"
          mkdir -p /var/log/cybersheppard

          {
            echo "=== Network Segmentation Report ==="
            echo "Generated: $(date)"
            echo "Hostname: $(hostname)"
            echo ""

            echo "--- Network Interfaces ---"
            ip addr show
            echo ""

            echo "--- Routing Table ---"
            ip route show
            echo ""

            echo "--- Active Connections ---"
            ss -tuln
            echo ""

            echo "--- Firewall Status ---"
            if command -v firewall-cmd &>/dev/null; then
              firewall-cmd --list-all
            elif command -v ufw &>/dev/null; then
              ufw status verbose
            elif command -v iptables &>/dev/null; then
              iptables -L -n -v
            fi
            echo ""

            echo "--- Network Namespaces ---"
            ip netns list || echo "None configured"
            echo ""

          } > "$report_file"

          echo "Network segmentation report generated: $report_file"
          exit 0

  # STEP 7: Port Scanning Protection
  - name: "Configure port scanning protection"
    control_id: "network_portscan_protection"
    priority: "high"
    description: "Detect and block port scanning attempts"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(a)", "Art.21(2)(f)"]
      nist: ["SI-4", "SI-4(4)"]
      iso: ["A.8.16"]
      mitre: ["D3-NTF"]

    tasks:
      - name: "Install fail2ban for port scan detection"
        action: "package_install"
        packages: ["fail2ban"]

      - name: "Configure fail2ban for SSH"
        action: "file_content"
        file: "/etc/fail2ban/jail.d/cybersheppard-ssh.conf"
        mode: "0644"
        owner: "root:root"
        content: |
          [sshd]
          enabled = true
          port = ${ssh_port}
          filter = sshd
          logpath = /var/log/auth.log
          maxretry = 5
          bantime = 3600
          findtime = 600

      - name: "Enable fail2ban service"
        action: "systemd_service"
        service: "fail2ban"
        state: "enabled"

      - name: "Start fail2ban"
        action: "command"
        command: "systemctl start fail2ban"
        expected_exit_code: 0

  # STEP 8: Disable Unused Network Protocols
  - name: "Disable unused network protocols"
    control_id: "network_protocol_minimization"
    priority: "medium"
    description: "Disable DCCP, SCTP, RDS, TIPC protocols"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(a)"]
      nist: ["CM-7", "CM-7(1)"]
      iso: ["A.8.9"]
      mitre: ["D3-ANCI"]

    tasks:
      - name: "Create protocol blacklist"
        action: "file_content"
        file: "/etc/modprobe.d/cybersheppard-protocols.conf"
        mode: "0644"
        owner: "root:root"
        content: |
          # Disable uncommon network protocols
          install dccp /bin/true
          install sctp /bin/true
          install rds /bin/true
          install tipc /bin/true

verification_steps:
  - name: "Verify firewall is active"
    command: |
      if command -v firewall-cmd &>/dev/null; then
        firewall-cmd --state
      elif command -v ufw &>/dev/null; then
        ufw status | grep -q 'Status: active' && echo "running"
      elif command -v iptables &>/dev/null; then
        iptables -L -n | grep -q 'Chain' && echo "running"
      fi
    expected_output_contains: "running"
    critical: true

  - name: "Verify SSH port is allowed"
    command: |
      if command -v firewall-cmd &>/dev/null; then
        firewall-cmd --list-ports | grep -q "${ssh_port}/tcp"
      elif command -v ufw &>/dev/null; then
        ufw status | grep -q "${ssh_port}/tcp"
      elif command -v iptables &>/dev/null; then
        iptables -L INPUT -n | grep -q "dpt:${ssh_port}"
      fi
    expected_exit_code: 0
    critical: true

  - name: "Verify default input policy is restrictive"
    command: |
      if command -v iptables &>/dev/null; then
        iptables -L -n | grep 'Chain INPUT' | grep -q 'policy DROP'
      fi
    expected_exit_code: 0
    condition: "firewall_system == 'iptables'"

  - name: "Verify network sysctl parameters"
    command: "sysctl net.ipv4.conf.all.rp_filter net.ipv4.tcp_syncookies"
    expected_output_contains:
      - "net.ipv4.conf.all.rp_filter = 1"
      - "net.ipv4.tcp_syncookies = 1"

  - name: "Verify fail2ban is running"
    command: "systemctl is-active fail2ban"
    expected_output: "active"

health_checks:
  - name: "SSH connectivity test"
    command: "timeout 5 nc -zv localhost ${ssh_port} 2>&1 | grep -q 'succeeded\\|open'"
    expected_exit_code: 0
    critical: true
    error_message: "CRITICAL: SSH port ${ssh_port} is not accessible - firewall may have blocked SSH"

  - name: "Firewall service active"
    command: |
      if command -v firewall-cmd &>/dev/null; then
        systemctl is-active firewalld
      elif command -v ufw &>/dev/null; then
        systemctl is-active ufw
      else
        echo "active"
      fi
    expected_output: "active"
    critical: true

  - name: "Network connectivity test"
    command: "ping -c 1 8.8.8.8 || ping -c 1 1.1.1.1"
    expected_exit_code: 0
    critical: true
    error_message: "Network connectivity lost after firewall configuration"

  - name: "DNS resolution working"
    command: "nslookup google.com || host google.com"
    expected_exit_code: 0
    critical: false

rollback:
  enabled: true
  automatic_trigger:
    - "health_check_failed"
    - "ssh_connection_lost"
  steps:
    - name: "Disable firewall immediately"
      action: "command"
      command: |
        if command -v firewall-cmd &>/dev/null; then
          systemctl stop firewalld
        elif command -v ufw &>/dev/null; then
          ufw disable
        elif command -v iptables &>/dev/null; then
          iptables -P INPUT ACCEPT
          iptables -P FORWARD ACCEPT
          iptables -P OUTPUT ACCEPT
          iptables -F
        fi
      critical: true
      note: "Emergency firewall disable to restore connectivity"

    - name: "Restore original firewall rules"
      action: "restore_backups"

    - name: "Restore original sysctl settings"
      action: "command"
      command: "sysctl -p /etc/sysctl.conf"

    - name: "Verify SSH accessible after rollback"
      action: "command"
      command: "nc -zv localhost ${ssh_port}"
      expected_exit_code: 0
      critical: true

post_execution_notes: |
  NETWORK SECURITY HARDENING COMPLETED

  ⚠️  CRITICAL WARNINGS:

  1. FIREWALL NOW ACTIVE - DEFAULT DENY:
     ✓ All incoming connections are BLOCKED by default
     ✓ SSH port ${ssh_port} is ALLOWED
     ✓ Established connections are allowed
     ✓ Outgoing connections are allowed

     IF YOU LOSE CONNECTION:
     - Use console/serial access
     - Disable firewall: systemctl stop firewalld (or ufw disable)
     - Review and fix firewall rules
     - Re-enable: systemctl start firewalld (or ufw enable)

  2. SERVICES MAY BE BLOCKED:
     The following services are now blocked unless explicitly allowed:
     - Web servers (HTTP/HTTPS port 80/443)
     - Database servers (MySQL 3306, PostgreSQL 5432)
     - Monitoring agents (Zabbix, Nagios, Prometheus)
     - Application ports

     TO ALLOW A SERVICE:
     firewalld: firewall-cmd --permanent --add-service=http && firewall-cmd --reload
     UFW: ufw allow 80/tcp
     iptables: iptables -A INPUT -p tcp --dport 80 -j ACCEPT && iptables-save

  3. RATE LIMITING ACTIVE:
     - SSH: Maximum 10 new connections per minute
     - Exceeding limits will result in temporary blocks
     - fail2ban: 5 failed login attempts = 1 hour ban

  4. NETWORK CONFIGURATION:
     ✓ IP forwarding disabled (not a router)
     ✓ IP spoofing protection enabled
