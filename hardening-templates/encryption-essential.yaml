metadata:
  name: "encryption-essential"
  version: "1.0.0"
  description: "Essential encryption and data protection - TLS/SSL hardening, disk encryption verification, cryptographic policy enforcement"
  framework: ["nis2", "nist", "iso27001", "mitre"]
  compliance_level: "Essential"
  target_os: ["debian", "ubuntu", "rhel", "centos", "rocky", "alma", "sles"]
  target_role: "generic"
  priority: "critical"
  estimated_minutes: 25
  requires_reboot: false
  author: "CyberSheppard Team"
  created_at: "2026-01-19"
  tags: ["encryption", "tls", "ssl", "cryptography", "disk-encryption", "ssh-hardening"]

risk_assessment:
  level: "medium"
  description: "Enforces strong cryptographic policies and disables weak ciphers. May break compatibility with legacy clients/applications. SSH configuration changes may lock out users if not tested properly."
  rollback_supported: true
  dry_run_recommended: true
  potential_impact:
    - "Legacy applications using weak TLS versions (TLS 1.0/1.1) will fail"
    - "SSH clients with old cipher support may be unable to connect"
    - "Some monitoring/backup tools may require cipher suite updates"
    - "Web services may need cipher suite reconfiguration"
  mitigation:
    - "Maintain console/serial access during deployment"
    - "Test SSH connection from secondary session before closing primary"
    - "Verify application compatibility with TLS 1.2+ before deployment"
    - "Keep backup SSH config available"

preflight_checks:
  - name: "Verify root access"
    command: "id -u"
    expected_output: "0"
    failure_action: "abort"
    error_message: "Root privileges required for encryption hardening"

  - name: "Check OpenSSL availability"
    command: "openssl version"
    expected_exit_code: 0
    failure_action: "abort"
    error_message: "OpenSSL not found"

  - name: "Verify SSH daemon config directory"
    command: "test -d /etc/ssh"
    expected_exit_code: 0
    failure_action: "abort"
    error_message: "/etc/ssh directory not found"

  - name: "Check if cryptsetup available (for LUKS verification)"
    command: "which cryptsetup"
    expected_exit_code: 0
    failure_action: "warn"
    error_message: "cryptsetup not found - disk encryption checks will be skipped"

  - name: "Verify current SSH connection"
    command: "systemctl is-active sshd || systemctl is-active ssh"
    expected_output: "active"
    failure_action: "abort"
    error_message: "SSH not running - cannot safely modify SSH configuration"

  - name: "Test SSH config syntax before changes"
    command: "sshd -t"
    expected_exit_code: 0
    failure_action: "abort"
    error_message: "Current SSH configuration is invalid"

backup_files:
  - "/etc/ssh/sshd_config"
  - "/etc/ssh/ssh_config"
  - "/etc/ssl/openssl.cnf"
  - "/etc/crypto-policies/config"  # RHEL/CentOS
  - "/etc/default/apticron"  # If exists
  - "/etc/ssl/certs/"  # Directory backup
  - "/etc/pki/tls/openssl.cnf"  # RHEL path

hardening_steps:
  # STEP 1: SSH Cryptographic Hardening
  - name: "Harden SSH server cryptographic configuration"
    control_id: "encryption_ssh_hardening"
    priority: "critical"
    description: "Enforce strong SSH ciphers, MACs, and key exchange algorithms. Disable weak cryptography."
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(c)", "Art.21(2)(e)"]
      nist: ["SC-8", "SC-8(1)", "SC-13", "IA-5(1)", "MA-4(6)"]
      iso: ["A.8.24", "A.5.14"]
      mitre: ["D3-DNSTLS", "D3-ENCR"]

    tasks:
      - name: "Configure strong SSH ciphers only"
        action: "file_line_replace"
        file: "/etc/ssh/sshd_config"
        search: "^#?Ciphers.*"
        replace: "Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr"
        create_if_missing: true
        validation:
          command: "sshd -t"
          expected_exit_code: 0

      - name: "Configure strong SSH MACs only"
        action: "file_line_replace"
        file: "/etc/ssh/sshd_config"
        search: "^#?MACs.*"
        replace: "MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256"
        validation:
          command: "sshd -t"

      - name: "Configure strong SSH key exchange algorithms"
        action: "file_line_replace"
        file: "/etc/ssh/sshd_config"
        search: "^#?KexAlgorithms.*"
        replace: "KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group-exchange-sha256"
        validation:
          command: "sshd -t"

      - name: "Configure strong SSH host key algorithms"
        action: "file_line_replace"
        file: "/etc/ssh/sshd_config"
        search: "^#?HostKeyAlgorithms.*"
        replace: "HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256"
        validation:
          command: "sshd -t"

      - name: "Disable weak SSH host keys"
        action: "file_line_replace"
        file: "/etc/ssh/sshd_config"
        search: "^HostKey /etc/ssh/ssh_host_dsa_key.*"
        replace: "#HostKey /etc/ssh/ssh_host_dsa_key"
        validation:
          command: "sshd -t"

      - name: "Disable ECDSA host key (prefer Ed25519)"
        action: "file_line_replace"
        file: "/etc/ssh/sshd_config"
        search: "^HostKey /etc/ssh/ssh_host_ecdsa_key.*"
        replace: "#HostKey /etc/ssh/ssh_host_ecdsa_key"
        validation:
          command: "sshd -t"

      - name: "Ensure Ed25519 host key exists"
        action: "command"
        command: "test -f /etc/ssh/ssh_host_ed25519_key || ssh-keygen -t ed25519 -f /etc/ssh/ssh_host_ed25519_key -N ''"
        expected_exit_code: 0

      - name: "Ensure RSA host key is at least 4096 bits"
        action: "command"
        command: |
          if [ -f /etc/ssh/ssh_host_rsa_key ]; then
            key_bits=$(ssh-keygen -lf /etc/ssh/ssh_host_rsa_key | awk '{print $1}')
            if [ "$key_bits" -lt 4096 ]; then
              ssh-keygen -t rsa -b 4096 -f /etc/ssh/ssh_host_rsa_key -N ''
            fi
          else
            ssh-keygen -t rsa -b 4096 -f /etc/ssh/ssh_host_rsa_key -N ''
          fi
        expected_exit_code: 0

      - name: "Test SSH configuration syntax"
        action: "command"
        command: "sshd -t"
        expected_exit_code: 0
        critical: true

      - name: "Reload SSH daemon"
        action: "command"
        command: "systemctl reload sshd || systemctl reload ssh"
        expected_exit_code: 0
        critical: true

  # STEP 2: System-wide Cryptographic Policy (RHEL 8+)
  - name: "Enforce system-wide cryptographic policy"
    control_id: "encryption_crypto_policy"
    priority: "high"
    description: "Set system-wide crypto policy to FUTURE or FIPS (RHEL/CentOS 8+)"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(c)"]
      nist: ["SC-13", "SC-12"]
      iso: ["A.8.24"]
      mitre: ["D3-ENCR"]
    os_family: ["rhel", "centos", "rocky", "alma"]
    os_version: [">=8"]

    tasks:
      - name: "Set crypto policy to FUTURE"
        action: "command"
        command: "update-crypto-policies --set FUTURE"
        expected_exit_code: 0
        verification:
          command: "update-crypto-policies --show"
          expected_output: "FUTURE"
        note: "FUTURE policy enforces TLS 1.2+, strong ciphers, 3072+ bit keys"

      - name: "Apply crypto policy"
        action: "command"
        command: "update-crypto-policies --apply"
        expected_exit_code: 0

  # STEP 3: OpenSSL Configuration Hardening
  - name: "Harden OpenSSL configuration"
    control_id: "encryption_openssl_hardening"
    priority: "high"
    description: "Configure OpenSSL to use strong ciphers and disable weak protocols"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(c)"]
      nist: ["SC-8", "SC-8(1)", "SC-13"]
      iso: ["A.8.24"]
      mitre: ["D3-ENCR"]

    tasks:
      - name: "Configure OpenSSL cipher suites (Debian/Ubuntu)"
        action: "file_section_update"
        file: "/etc/ssl/openssl.cnf"
        section: "system_default_sect"
        content: |
          [system_default_sect]
          MinProtocol = TLSv1.2
          CipherString = ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
        create_section_if_missing: true
        condition: "os_family == 'debian'"

      - name: "Configure OpenSSL cipher suites (RHEL/CentOS)"
        action: "file_section_update"
        file: "/etc/pki/tls/openssl.cnf"
        section: "system_default_sect"
        content: |
          [system_default_sect]
          MinProtocol = TLSv1.2
          CipherString = ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
        create_section_if_missing: true
        condition: "os_family == 'rhel'"

      - name: "Verify OpenSSL can initialize with new config"
        action: "command"
        command: "openssl version"
        expected_exit_code: 0

  # STEP 4: Disk Encryption Verification
  - name: "Verify disk encryption status"
    control_id: "encryption_disk_encryption"
    priority: "critical"
    description: "Check if full disk encryption (LUKS) is enabled and properly configured"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(i)", "Art.21(2)(c)"]
      nist: ["SC-28", "SC-28(1)", "SC-13"]
      iso: ["A.8.11"]
      mitre: ["D3-DENCR"]

    tasks:
      - name: "Check for LUKS encrypted volumes"
        action: "command"
        command: "lsblk -o NAME,FSTYPE | grep -i crypto_LUKS || blkid | grep -i crypto_LUKS"
        expected_exit_code: 0
        failure_action: "warn"
        error_message: "No LUKS encrypted volumes detected. Consider enabling full disk encryption."

      - name: "List encrypted volumes"
        action: "command"
        command: "dmsetup ls --target crypt"
        save_output: "encrypted_volumes"
        failure_action: "warn"

      - name: "Document encryption status for compliance"
        action: "file_content"
        file: "/var/log/cybersheppard/encryption-status.log"
        content: |
          # Disk Encryption Status - $(date)
          # Generated by CyberSheppard Hardening

          Encrypted Volumes:
          $(dmsetup ls --target crypt)

          Block Devices:
          $(lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINT)

          LUKS Volumes:
          $(blkid | grep crypto_LUKS || echo "None found")
        create_directory: true

  # STEP 5: TLS Certificate Validation
  - name: "Verify TLS certificate configuration"
    control_id: "encryption_tls_certificates"
    priority: "high"
    description: "Check certificate validity, key strength, and proper configuration"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(c)"]
      nist: ["SC-8(1)", "SC-17"]
      iso: ["A.8.24"]
      mitre: ["D3-ENCR"]

    tasks:
      - name: "Find SSL/TLS certificates"
        action: "command"
        command: "find /etc/ssl/certs /etc/pki/tls/certs /etc/letsencrypt -name '*.crt' -o -name '*.pem' 2>/dev/null"
        save_output: "certificate_locations"
        failure_action: "warn"

      - name: "Validate certificate key strength"
        action: "script"
        script: |
          #!/bin/bash
          # Check all certificates for weak key sizes
          weak_certs=0

          for cert in $(find /etc/ssl/certs /etc/pki/tls/certs -name '*.crt' -o -name '*.pem' 2>/dev/null); do
            if [ -f "$cert" ]; then
              # Get key size
              key_size=$(openssl x509 -in "$cert" -noout -text 2>/dev/null | grep -i "Public-Key:" | grep -oE '[0-9]+' | head -1)

              if [ ! -z "$key_size" ] && [ "$key_size" -lt 2048 ]; then
                echo "WEAK: $cert has $key_size bit key (minimum 2048 required)"
                weak_certs=$((weak_certs + 1))
              fi
            fi
          done

          if [ $weak_certs -gt 0 ]; then
            echo "WARNING: $weak_certs certificates with weak key sizes found"
            exit 1
          fi

          echo "All certificates have adequate key strength (2048+ bits)"
          exit 0
        failure_action: "warn"
        error_message: "Weak certificates detected - consider regenerating with 2048+ bit keys"

  # STEP 6: Secure File Transfer Configuration
  - name: "Configure secure file transfer settings"
    control_id: "encryption_secure_transfer"
    priority: "medium"
    description: "Ensure SFTP is properly configured and FTP/Telnet are disabled"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(c)"]
      nist: ["SC-8", "SC-8(1)"]
      iso: ["A.8.24"]
      mitre: ["D3-ENCR"]

    tasks:
      - name: "Enable SFTP subsystem in SSH"
        action: "file_line_present"
        file: "/etc/ssh/sshd_config"
        line: "Subsystem sftp /usr/lib/openssh/sftp-server"
        verification:
          command: "grep -q 'Subsystem sftp' /etc/ssh/sshd_config"
          expected_exit_code: 0

      - name: "Disable FTP service (vsftpd)"
        action: "systemd_service"
        service: "vsftpd"
        state: "disabled"
        condition: "service_exists('vsftpd')"

      - name: "Disable telnet service"
        action: "systemd_service"
        service: "telnet"
        state: "disabled"
        condition: "service_exists('telnet')"

  # STEP 7: Entropy and Random Number Generation
  - name: "Ensure adequate entropy for cryptographic operations"
    control_id: "encryption_entropy"
    priority: "medium"
    description: "Verify system has adequate entropy sources for strong random number generation"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(c)"]
      nist: ["SC-13"]
      iso: ["A.8.24"]
      mitre: ["D3-ENCR"]

    tasks:
      - name: "Check available entropy"
        action: "command"
        command: "cat /proc/sys/kernel/random/entropy_avail"
        save_output: "entropy_level"
        verification:
          command: "[ $(cat /proc/sys/kernel/random/entropy_avail) -gt 1000 ]"
          expected_exit_code: 0
        failure_action: "warn"
        error_message: "Low entropy detected - consider installing haveged or rng-tools"

      - name: "Install haveged for entropy generation (if low)"
        action: "package_install"
        packages: ["haveged"]
        condition: "entropy_level < 1000"
        post_install:
          command: "systemctl enable --now haveged"

  # STEP 8: SSH Client Hardening
  - name: "Harden SSH client configuration"
    control_id: "encryption_ssh_client"
    priority: "medium"
    description: "Configure system-wide SSH client to use strong cryptography"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(c)"]
      nist: ["SC-8", "SC-8(1)", "SC-13"]
      iso: ["A.8.24"]
      mitre: ["D3-ENCR"]

    tasks:
      - name: "Configure SSH client crypto settings"
        action: "file_content"
        file: "/etc/ssh/ssh_config.d/99-cybersheppard-hardening.conf"
        mode: "0644"
        owner: "root:root"
        content: |
          # CyberSheppard SSH Client Hardening

          Host *
            # Strong ciphers only
            Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr

            # Strong MACs only
            MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256

            # Strong key exchange
            KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group-exchange-sha256

            # Strong host key algorithms
            HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256

            # Verify host keys
            StrictHostKeyChecking ask

            # Disable agent forwarding by default
            ForwardAgent no

            # Disable X11 forwarding by default
            ForwardX11 no
        create_directory: true

  # STEP 9: Data-at-Rest Encryption Verification
  - name: "Document data-at-rest encryption status"
    control_id: "encryption_data_at_rest"
    priority: "high"
    description: "Document encryption status of sensitive directories and compliance evidence"
    frameworks: ["nis2", "nist", "iso27001", "mitre"]
    framework_references:
      nis2: ["Art.21(2)(i)"]
      nist: ["SC-28", "SC-28(1)"]
      iso: ["A.8.11"]
      mitre: ["D3-DENCR"]

    tasks:
      - name: "Generate encryption compliance report"
        action: "script"
        script: |
          #!/bin/bash
          report_file="/var/log/cybersheppard/encryption-compliance-report.txt"
          mkdir -p /var/log/cybersheppard

          {
            echo "=== Encryption Compliance Report ==="
            echo "Generated: $(date)"
            echo "Hostname: $(hostname)"
            echo ""

            echo "--- Disk Encryption Status ---"
            dmsetup ls --target crypt 2>/dev/null || echo "No encrypted volumes detected"
            echo ""

            echo "--- LUKS Volumes ---"
            blkid | grep crypto_LUKS || echo "No LUKS volumes detected"
            echo ""

            echo "--- SSH Cryptography ---"
            grep -E "^(Ciphers|MACs|KexAlgorithms)" /etc/ssh/sshd_config || echo "Default SSH crypto"
            echo ""

            echo "--- TLS Configuration ---"
            grep -i "MinProtocol" /etc/ssl/openssl.cnf /etc/pki/tls/openssl.cnf 2>/dev/null || echo "Default TLS config"
            echo ""

            echo "--- System Crypto Policy (RHEL 8+) ---"
            update-crypto-policies --show 2>/dev/null || echo "N/A (not RHEL 8+)"
            echo ""

            echo "--- Entropy Status ---"
            echo "Available entropy: $(cat /proc/sys/kernel/random/entropy_avail) bits"
            echo ""

          } > "$report_file"

          echo "Encryption compliance report generated: $report_file"
          exit 0

verification_steps:
  - name: "Verify SSH daemon config is valid"
    command: "sshd -t"
    expected_exit_code: 0
    critical: true

  - name: "Test SSH connection with strong crypto"
    command: "ssh -o Ciphers=aes256-gcm@openssh.com -o MACs=hmac-sha2-512 -o KexAlgorithms=curve25519-sha256 -o StrictHostKeyChecking=no localhost -p 22 exit 2>/dev/null || echo 'SSH test: config applied'"
    expected_exit_code: 0
    note: "This tests if SSH accepts strong crypto settings"

  - name: "Verify strong SSH ciphers configured"
    command: "grep '^Ciphers' /etc/ssh/sshd_config"
    expected_output_contains:
      - "chacha20-poly1305"
      - "aes256-gcm"

  - name: "Verify strong SSH MACs configured"
    command: "grep '^MACs' /etc/ssh/sshd_config"
    expected_output_contains:
      - "hmac-sha2-512"
      - "hmac-sha2-256"

  - name: "Check OpenSSL minimum TLS version"
    command: "grep -i 'MinProtocol' /etc/ssl/openssl.cnf /etc/pki/tls/openssl.cnf 2>/dev/null"
    expected_output_contains: "TLSv1.2"
    failure_action: "warn"

  - name: "Verify entropy level adequate"
    command: "[ $(cat /proc/sys/kernel/random/entropy_avail) -gt 1000 ] && echo 'Entropy: OK'"
    expected_output: "Entropy: OK"

health_checks:
  - name: "SSH service active after changes"
    command: "systemctl is-active sshd || systemctl is-active ssh"
    expected_output: "active"
    critical: true
    error_message: "SSH service failed after configuration changes - CRITICAL"

  - name: "Test SSH connection from localhost"
    command: "timeout 5 ssh -o StrictHostKeyChecking=no -o BatchMode=yes localhost exit 2>/dev/null; test $? -ne 255"
    expected_exit_code: 0
    critical: true
    error_message: "SSH connection test failed - configuration may have broken SSH access"

  - name: "Verify SSH listening on port 22"
    command: "ss -tlnp | grep -q ':22 '"
    expected_exit_code: 0
    critical: true
    error_message: "SSH not listening on port 22"

  - name: "OpenSSL functional"
    command: "openssl version"
    expected_exit_code: 0
    critical: true

  - name: "Check for SSH config syntax errors"
    command: "sshd -t 2>&1"
    expected_exit_code: 0
    critical: true

rollback:
  enabled: true
  automatic_trigger:
    - "health_check_failed"
    - "ssh_connection_lost"
    - "configuration_invalid"
  steps:
    - name: "Restore SSH daemon configuration"
      action: "restore_backup"
      file: "/etc/ssh/sshd_config"
      critical: true

    - name: "Restore SSH client configuration"
      action: "restore_backup"
      file: "/etc/ssh/ssh_config"

    - name: "Test restored SSH config"
      action: "command"
      command: "sshd -t"
      expected_exit_code: 0
      critical: true

    - name: "Reload SSH daemon with restored config"
      action: "command"
      command: "systemctl reload sshd || systemctl reload ssh"
      critical: true

    - name: "Restore OpenSSL configuration"
      action: "restore_backup"
      file: "/etc/ssl/openssl.cnf"

    - name: "Restore crypto policy (RHEL)"
      action: "command"
      command: "update-crypto-policies --set DEFAULT && update-crypto-policies --apply"
      condition: "os_family == 'rhel' and os_version >= 8"

post_execution_notes: |
  ENCRYPTION HARDENING COMPLETED - IMPORTANT NOTES:

  1. SSH CONFIGURATION CHANGES:
     ✓ Strong ciphers enforced (ChaCha20, AES-GCM, AES-CTR)
     ✓ Strong MACs enforced (HMAC-SHA2-512/256 with ETM)
     ✓ Modern key exchange (Curve25519, DH-GEX-SHA256)
     ✓ Weak algorithms disabled (DSA, ECDSA, MD5, SHA1)

     WARNING: Legacy SSH clients may not be able to connect
     - Ensure you have tested SSH access before disconnecting
     - Keep a backup console/serial access method available

  2. TLS/SSL HARDENING:
     ✓ Minimum TLS version: 1.2
     ✓ Weak ciphers disabled (3DES, RC4, MD5, export ciphers)
     ✓ Strong cipher suites prioritized (ECDHE, GCM, ChaCha20)

     WARNING: Applications using TLS 1.0/1.1 will fail
     - Update applications to support TLS 1.2+
     - Check web servers, databases, monitoring tools

  3. DISK ENCRYPTION STATUS:
     - Encryption status documented in /var/log/cybersheppard/
     - If no LUKS volumes detected, consider implementing full disk encryption
     - For compliance: document encryption status and exception justification

  4. NEXT STEPS:
     [ ] Test SSH access from all expected client locations
     [ ] Update application configurations for TLS 1.2+ compatibility
     [ ] Verify monitoring/backup tools still connect properly
     [ ] Review encryption compliance report
     [ ] Consider implementing full disk encryption if not present
     [ ] Generate new SSH host keys if weak algorithms were in use

  5. VERIFICATION COMMANDS:
     # Test SSH connection
     ssh -v user@localhost

     # Check SSH crypto in use
     ssh -vv user@host 2>&1 | grep -i "cipher\|mac\|kex"

     # Verify TLS version
     openssl s_client -connect localhost:443 -tls1_1 < /dev/null
     # Should fail with "wrong version number" or "no protocols available"

     # Check entropy
     cat /proc/sys/kernel/random/entropy_avail
     # Should be > 1000

  6. TROUBLESHOOTING:
     - If SSH fails: Boot into recovery mode and restore /etc/ssh/sshd_config from backup
     - If applications fail: Check logs for TLS/SSL handshake errors
     - If low entropy: Install haveged or rng-tools package
     - Crypto policy conflicts (RHEL): update-crypto-policies --show

compliance_evidence:
  - file: "/etc/ssh/sshd_config"
    description: "SSH server cryptographic configuration"
    controls: ["encryption_ssh_hardening"]
    command: "sshd -T | grep -E '(ciphers|macs|kexalgorithms|hostkeyalgorithms)'"

  - file: "/etc/ssh/ssh_config.d/99-cybersheppard-hardening.conf"
    description: "SSH client cryptographic configuration"
    controls: ["encryption_ssh_client"]

  - file: "/etc/ssl/openssl.cnf"
