name: CyberSheppard CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  RUST_VERSION: '1.75'
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # Rust Backend - Build & Test
  # ============================================================================
  rust-backend:
    name: Rust Backend (Build & Test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cybersheppard_test
          POSTGRES_USER: cybersheppard
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      influxdb:
        image: influxdb:2.7
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: admin
          DOCKER_INFLUXDB_INIT_PASSWORD: test_password
          DOCKER_INFLUXDB_INIT_ORG: cybersheppard
          DOCKER_INFLUXDB_INIT_BUCKET: metrics
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: test_token_for_ci
        ports:
          - 8086:8086

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup test database
        working-directory: backend-rust
        env:
          DATABASE_URL: postgresql://cybersheppard:test_password@localhost:5432/cybersheppard_test
        run: |
          cargo install sqlx-cli --no-default-features --features postgres
          sqlx database create
          sqlx migrate run

      - name: Check formatting
        working-directory: backend-rust
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: backend-rust
        run: cargo clippy -- -D warnings

      - name: Build
        working-directory: backend-rust
        env:
          DATABASE_URL: postgresql://cybersheppard:test_password@localhost:5432/cybersheppard_test
        run: cargo build --verbose

      - name: Run tests
        working-directory: backend-rust
        env:
          DATABASE_URL: postgresql://cybersheppard:test_password@localhost:5432/cybersheppard_test
          INFLUXDB_URL: http://localhost:8086
          INFLUXDB_TOKEN: test_token_for_ci
          INFLUXDB_ORG: cybersheppard
          INFLUXDB_BUCKET: metrics
          JWT_SECRET: test_secret_key_for_ci_only
          RUST_LOG: info
        run: cargo test --verbose -- --test-threads=1

      - name: Generate test coverage
        working-directory: backend-rust
        env:
          DATABASE_URL: postgresql://cybersheppard:test_password@localhost:5432/cybersheppard_test
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --out Xml --output-dir coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: backend-rust/coverage/cobertura.xml
          flags: rust-backend

  # ============================================================================
  # Django Backend - Build & Test
  # ============================================================================
  django-backend:
    name: Django Backend (Build & Test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cybersheppard_test
          POSTGRES_USER: cybersheppard
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend-django
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run Django checks
        working-directory: backend-django
        env:
          DATABASE_URL: postgresql://cybersheppard:test_password@localhost:5432/cybersheppard_test
          DJANGO_SETTINGS_MODULE: cybersheppard_django.settings
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        working-directory: backend-django
        env:
          DATABASE_URL: postgresql://cybersheppard:test_password@localhost:5432/cybersheppard_test
          DJANGO_SETTINGS_MODULE: cybersheppard_django.settings
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: backend-django/coverage.xml
          flags: django-backend

  # ============================================================================
  # Frontend - Build & Test
  # ============================================================================
  frontend:
    name: Frontend (Build & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter
        working-directory: frontend
        run: npm run lint

      - name: Run type checking
        working-directory: frontend
        run: npm run type-check

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run tests
        working-directory: frontend
        run: npm test -- --coverage

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Rust security audit
        working-directory: backend-rust
        run: |
          cargo install cargo-audit
          cargo audit

  # ============================================================================
  # Docker Image Build
  # ============================================================================
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [rust-backend, django-backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            cybersheppard/backend-rust
            cybersheppard/backend-django
            cybersheppard/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}

      - name: Build and push Rust backend
        uses: docker/build-push-action@v5
        with:
          context: backend-rust
          push: true
          tags: cybersheppard/backend-rust:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Django backend
        uses: docker/build-push-action@v5
        with:
          context: backend-django
          push: true
          tags: cybersheppard/backend-django:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: cybersheppard/frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Deployment (Production)
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, security]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://cybersheppard.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via SSH
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
            cd /opt/cybersheppard
            git pull origin main
            docker-compose pull
            docker-compose up -d --remove-orphans
            docker-compose exec -T backend-rust /app/healthcheck.sh
          EOF

      - name: Verify deployment
        run: |
          sleep 10
          curl --fail https://cybersheppard.example.com/api/health || exit 1

  # ============================================================================
  # Deployment (Staging)
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.cybersheppard.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add staging deployment commands here
